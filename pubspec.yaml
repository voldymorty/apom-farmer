name: client
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  image_picker: ^1.2.1
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  permission_handler: ^11.0.1
  animated_bottom_navigation_bar: ^1.4.0
  percent_indicator: ^4.2.5
  intl: ^0.20.2
  confetti: ^0.7.0
  url_launcher: 6.2.6
  http: ^1.2.1
  http_parser: ^4.0.0
  flutter_riverpod: ^2.5.1
  image_cropper: ^11.0.0
  flutter_secure_storage: ^10.0.0
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.0
  flutter_image_compress: ^2.4.0
  flutter_local_notifications: ^18.0.1
  go_router: ^14.7.2
  webview_flutter: ^4.12.0
  fl_chart: ^0.69.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  url_launcher_android: 6.3.20

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/formerLogo.png"
